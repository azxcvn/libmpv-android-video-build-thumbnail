name: Build libmpv-android

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      release:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    container: docker.io/debian:bookworm-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependency
        run: |
          echo "deb http://deb.debian.org/debian bookworm-backports main" | tee /etc/apt/sources.list.d/bookworm-backports.list
          apt update
          apt install -y sudo git gcc-multilib libc-dev make automake pkg-config libtool nasm python3-jsonschema wget python3-jinja2 zip python3-pip
          apt install -y -t bookworm-backports meson
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        with:
          link-to-sdk: true
          ndk-version: r27c
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: |
          set -e
          sed -i -e 's/sudo//g' *.sh
          sed -i 's/download-sdk\.sh/download-sdk-debian\.sh/g' download.sh
          sudo chmod +x include/download-sdk-debian.sh
          sudo chmod +x bundle_default.sh
          sudo chmod +x validate-flags.sh
          # 1) 先下载依赖，再干跑校验补丁与 FFmpeg 开关。
          #    这两步都只读、不落盘（--check-only），有问题会在几分钟内红在这。
          ./download.sh
          ./patch.sh --check-only
          ./validate-flags.sh flavors/default.sh
          # 2) 构建 + 打包。bundle_default.sh 内部会重新下载并真正打补丁，
          #    它自己没有 set -e，所以这里靠 set -e 显式挡住它的失败返回码。
          ./bundle_default.sh
          # 3) 产物断言（构建后，确认补丁真的进了二进制与 jar）
          echo "== 校验产物 =="
          grep -q 'mk_thumbnail_grab'    deps/mpv/include/mpv/client.h
          test -f deps/mpv/player/thumbnail.c
          test -f prefix/arm64-v8a/usr/local/lib/libmpv.so
          test -f default-arm64-v8a.jar
          echo "OK: 补丁预检、开关校验与产物校验全部通过"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: buildscripts/*.jar
      - uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || inputs.release == true
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            buildscripts/*.jar
